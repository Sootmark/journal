[package]
name = "sootmark-journal"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "systemd journal files (.journal, .journal~): entries and their fields, regular and compact, LZ4 decoded, damaged and online files read as far as they go."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/journal"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "linux", "systemd"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "journal"

[dependencies]
common = { package = "sootmark-common", version = "0.3.5" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
